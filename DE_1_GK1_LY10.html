<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đề 1 ôn tập giữa học kì I – Vật lí 10 (mỗi trang một câu)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{--bg:#eef1f5;--pp:#fff;--ink:#17202b;--mut:#566274;--acc:#1d4e89;--ok:#17703f;--okb:#e1f4e8;--no:#b3261e;--nob:#fbe6e3;--ln:#cfd7e2;--tn:#f2f5f9;--fs:clamp(28px,2.7vw,40px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--pp:#181e26;--ink:#e8ecf2;--mut:#a0acbc;--acc:#8dbaf0;--ok:#6fdca0;--okb:#143324;--no:#ff9a91;--nob:#3b1b19;--ln:#303a47;--tn:#202833;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1318;--pp:#181e26;--ink:#e8ecf2;--mut:#a0acbc;--acc:#8dbaf0;--ok:#6fdca0;--okb:#143324;--no:#ff9a91;--nob:#3b1b19;--ln:#303a47;--tn:#202833;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Serif 4","Times New Roman",serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--pp);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
.tr{display:flex;align-items:center;gap:10px;padding:8px 14px;max-width:1240px;margin:0 auto}
.tt{flex:1;min-width:0;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt span{color:var(--mut);font-weight:400}
.ib{border:1px solid var(--ln);background:var(--tn);border-radius:8px;padding:6px 12px;font-size:17px}
.pb{height:5px;background:var(--ln)}.pb i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
main{max-width:1240px;margin:0 auto;padding:22px 28px 140px}
.pg{font-size:var(--fs);line-height:1.5}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px;font-size:20px;color:var(--mut)}
.pt{background:var(--acc);color:var(--pp);border-radius:99px;padding:2px 16px;font-weight:600;font-size:20px}
.lv{font-size:17px;padding:1px 12px;border:1px solid var(--acc);border-radius:99px;color:var(--acc);font-family:system-ui,sans-serif}
.qt{margin:0 0 .5em}
.cols.hasg{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:100px}
@media(max-width:1000px){.cols.hasg{display:block}.side{position:static}}
.g{display:block;width:100%;max-width:640px;margin:10px auto;background:var(--pp);border:1px solid var(--ln);border-radius:10px}
.g line{stroke-width:1}.gl{stroke:var(--ln)}.ga{stroke:var(--mut)}
.gp{fill:none;stroke:var(--acc);stroke-width:2.2}.gd{fill:var(--acc)}
.gt{fill:var(--mut);font:10px system-ui,sans-serif}
.o{display:grid;grid-template-columns:1.7em 1fr 1.2em;align-items:start;gap:.4em;width:100%;text-align:left;margin:.4em 0;padding:.4em .7em;background:var(--tn);border:2px solid var(--ln);border-radius:14px}
.o:not(:disabled):hover{border-color:var(--acc)}
.o b{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;border:2px solid var(--acc);color:var(--acc);font-size:.8em;margin-top:.12em}
.o:disabled{cursor:default;color:inherit;opacity:1}
.o.ok,.stb button.ok{background:var(--okb);border-color:var(--ok)}
.o.no,.stb button.no{background:var(--nob);border-color:var(--no)}
.o.ok b{background:var(--ok);border-color:var(--ok);color:var(--pp)}
.o.no b{background:var(--no);border-color:var(--no);color:var(--pp)}
.mk{font-style:normal;font-weight:700}
.o.ok .mk{color:var(--ok)}.o.no .mk{color:var(--no)}
.fb{margin:.7em 0 0;padding:.5em .9em;border-left:6px solid var(--ok);background:var(--okb);border-radius:8px}
.fb.no{border-left-color:var(--no);background:var(--nob)}
.fb p{margin:.3em 0 0}
.fb small{display:block;margin-top:.5em;font-size:17px;color:var(--mut);font-style:italic}
.st{margin:.55em 0;padding:.45em .8em;border:2px solid var(--ln);border-left-width:8px;border-radius:12px;background:var(--tn)}
.st.ok{border-color:var(--ok);background:var(--okb)}.st.no{border-color:var(--no);background:var(--nob)}
.stb{display:flex;gap:12px;margin:.35em 0 .1em}
.stb button{padding:.15em 1.2em;border:2px solid var(--acc);border-radius:10px;background:var(--pp)}
.stb button:not(:disabled):hover{background:var(--tn)}
.stb button:disabled{cursor:default;opacity:.55}
.stb button.ok,.stb button.no{opacity:1;font-weight:700}
.ex{margin:.35em 0 0}
.st.ok .ex b.v{color:var(--ok)}.st.no .ex b.v{color:var(--no)}
.sar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:.6em 0}
.sa{font:inherit;color:inherit;width:6.5em;padding:.2em .5em;border:3px solid var(--ln);border-radius:12px;background:var(--pp)}
.sa.ok{border-color:var(--ok);background:var(--okb)}.sa.no{border-color:var(--no);background:var(--nob)}
.btn{padding:.2em 1.1em;border:2px solid var(--acc);border-radius:12px;background:var(--acc);color:var(--pp);font-weight:600}
.btn.sec{background:transparent;color:var(--acc)}
textarea{display:block;width:100%;min-height:3.2em;font:inherit;color:inherit;background:var(--pp);border:2px solid var(--ln);border-radius:12px;padding:.3em .6em;margin:.3em 0 .6em;resize:vertical}
.tb{border-collapse:collapse;margin:.4em 0}.tb th,.tb td{border:2px solid var(--ln);padding:.05em .7em;text-align:center}
.sub{margin:.6em 0 .1em}
.tlx{margin:.2em 0 .5em;padding:.4em .8em;border-left:6px solid var(--acc);background:var(--tn);border-radius:8px}
.hd{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:center;border-bottom:2px solid var(--ink);padding-bottom:12px;font-size:20px}
.hd b{display:block}.hd small{display:block;color:var(--mut);font-size:17px}
.cv h1{font-size:1.15em;text-align:center;margin:.7em 0 .1em;color:var(--acc)}
.cv ul{margin:.4em 0 .8em;padding-left:1.1em}
.big{display:block;margin:.8em auto 0;padding:.25em 1.6em}
.sc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:.7em 0}
.sc div{padding:.4em .8em;border:2px solid var(--ln);border-radius:12px;background:var(--tn)}
.sc b{display:block;font-size:1.3em;color:var(--acc)}
.rv{display:flex;flex-wrap:wrap;gap:8px;margin:.4em 0}
.rv button{font-size:20px;padding:4px 14px;border:2px solid var(--no);border-radius:10px;background:var(--nob)}
.bot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--pp);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.br{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1240px;margin:0 auto;padding:10px 14px}
.br .btn{font-size:22px;padding:6px 22px}
.br .btn:disabled{opacity:.35;cursor:default}
.bl{font-size:19px;color:var(--mut);text-align:center}
.ov{position:fixed;inset:0;z-index:40;background:rgba(10,14,20,.6);display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.pn{background:var(--pp);border-radius:14px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:16px 20px;font-size:18px}
.pn h3{margin:.8em 0 .3em;font-size:18px;color:var(--acc)}
.cells{display:flex;flex-wrap:wrap;gap:8px}
.cells button{width:52px;height:46px;border:2px solid var(--ln);border-radius:10px;background:var(--tn);font-size:18px}
.cells button.ok{background:var(--okb);border-color:var(--ok)}.cells button.no{background:var(--nob);border-color:var(--no)}.cells button.part{border-color:var(--acc);border-style:dashed}
.cells button.cur{outline:3px solid var(--acc)}
@media(max-width:560px){main{padding:16px 14px 140px}.hd{grid-template-columns:1fr}.tt span{display:none}}
</style>
</head>
<body>
<header class="top"><div class="tr"><button class="ib" id="menu" aria-label="Danh sách câu hỏi">☰ Câu hỏi</button><div class="tt" id="tt"></div><button class="ib" id="th" aria-label="Chế độ tối">🌙</button></div><div class="pb"><i id="pg"></i></div></header>
<main id="app"></main>
<footer class="bot"><div class="br"><button class="btn" id="pv">◀ Trước</button><div class="bl" id="bl"></div><button class="btn" id="nx">Sau ▶</button></div></footer>
<div class="ov" id="ov"><div class="pn" id="pn"></div></div>
<script>
const $=s=>document.querySelector(s),f=n=>n.toFixed(2).replace(".",",");
function G(p,xm,ym,yn,xs,ys){const w=320,h=200,L=36,T=10,B=26,R=12,W=w-L-R,H=h-T-B,X=t=>L+t/xm*W,Y=d=>T+(ym-d)/(ym-yn)*H;
let s=`<svg class=g viewBox="0 0 ${w} ${h}" role=img aria-label="Đồ thị độ dịch chuyển – thời gian">`;
for(let t=0;t<=xm;t+=xs)s+=`<line class=${t?"gl":"ga"} x1=${X(t)} y1=${T} x2=${X(t)} y2=${T+H}></line><text class=gt x=${X(t)} y=${h-10} text-anchor=middle>${t}</text>`;
for(let d=yn;d<=ym;d+=ys)s+=`<line class=${d?"gl":"ga"} x1=${L} y1=${Y(d)} x2=${L+W} y2=${Y(d)}></line><text class=gt x=${L-5} y=${Y(d)+4} text-anchor=end>${d}</text>`;
return s+`<polyline class=gp points="${p.map(q=>X(q[0])+","+Y(q[1])).join(" ")}"></polyline>`+p.map(q=>`<circle class=gd cx=${X(q[0])} cy=${Y(q[1])} r=3></circle>`).join("")+`<text class=gt x=${w-4} y=${Y(0)-5} text-anchor=end>t (s)</text><text class=gt x=${L+6} y=${T+10}>d (m)</text></svg>`}
const g1=()=>G([[0,0],[4,8],[6,8],[10,-4]],10,8,-4,2,4),g2=()=>G([[0,0],[4,6],[6,6],[8,2]],8,6,0,2,2),g3=()=>G([[0,0],[1,3],[5,15]],5,15,0,1,3),g4=()=>G([[0,0],[4,8],[6,8],[10,0]],10,8,0,2,2);

const MC=[
["Biết","Nêu được đối tượng nghiên cứu của Vật lí học","Đối tượng nghiên cứu của Vật lí học là các dạng vận động của",["sinh vật và môi trường sống.","chất, trường và năng lượng.","chỉ các chất ở thể rắn.","các hiện tượng xã hội."],1],
["Biết","Nhận biết các bước tìm hiểu thế giới tự nhiên dưới góc độ vật lí","Trong tiến trình tìm hiểu thế giới tự nhiên dưới góc độ vật lí, sau bước “Đưa ra dự đoán” là bước",["Kết luận.","Quan sát, thu thập thông tin.","Thí nghiệm kiểm tra dự đoán.","Xác định vấn đề cần nghiên cứu."],2],
["Biết","Nhận biết quy tắc an toàn trong học tập môn Vật lí","Trước khi cắm hoặc tháo một thiết bị điện khỏi ổ cắm, việc cần làm đúng là",["tắt công tắc nguồn của thiết bị.","giữ tay ướt để bám chắc phích cắm.","kéo mạnh dây điện để rút cho nhanh.","bật công tắc ở mức lớn nhất."],0],
["Biết","Chỉ ra đơn vị cơ bản và đơn vị dẫn xuất của hệ SI","Đơn vị nào sau đây KHÔNG phải là đơn vị cơ bản của hệ SI?",["kilôgam (kg).","mét (m).","giây (s).","niutơn (N)."],3],
["Biết","Định nghĩa được độ dịch chuyển","Đại lượng vừa cho biết độ dài, vừa cho biết hướng của sự thay đổi vị trí của vật gọi là",["quãng đường đi được.","tốc độ trung bình.","độ dịch chuyển.","thời gian chuyển động."],2],
["Biết","Nhận biết dụng cụ đo tốc độ trong phòng thí nghiệm","Để đo tốc độ tức thời của viên bi lăn trên máng nghiêng tại một vị trí xác định, bộ dụng cụ phù hợp là",["lực kế và thước dây.","cổng quang điện và đồng hồ đo thời gian hiện số.","nhiệt kế và đồng hồ treo tường.","vôn kế và ampe kế."],1],
["Hiểu","Phân biệt các loại mô hình trong nghiên cứu vật lí","Khi nghiên cứu chuyển động của ô tô trên quãng đường dài hàng trăm km, người ta coi ô tô là một chất điểm. Chất điểm thuộc loại mô hình nào?",["Mô hình lí thuyết.","Mô hình vật chất (vật thu nhỏ hoặc phóng to).","Mô hình toán học.","Không phải là mô hình."],0,"Chất điểm là khái niệm được trừu tượng hóa nên là mô hình lí thuyết."],
["Hiểu","Lập luận về quy tắc an toàn, nguy cơ cháy nổ","Vì sao không được dùng nước để dập đám cháy xảy ra ở thiết bị điện đang có điện?",["Vì nước bay hơi quá nhanh nên không dập được lửa.","Vì nước làm đám cháy lan rộng hơn.","Vì nước làm thiết bị nguội quá nhanh.","Vì nước dẫn điện, người dập lửa có nguy cơ bị điện giật."],3,"Nước dẫn điện nên có nguy cơ điện giật; phải ngắt nguồn điện trước."],
["Hiểu","Lập luận nêu loại sai số và cách khắc phục","Một học sinh dùng đồng hồ bấm giây đo thời gian rơi của vật, các lần bấm lệch nhau do phản xạ của tay. Đây là loại sai số nào và cách hạn chế hiệu quả nhất là gì?",["Sai số hệ thống; hiệu chỉnh lại điểm 0 của đồng hồ.","Sai số ngẫu nhiên; đo nhiều lần rồi lấy giá trị trung bình.","Sai số hệ thống; đo nhiều lần rồi lấy giá trị trung bình.","Sai số ngẫu nhiên; chỉ đo một lần bằng đồng hồ có độ chia nhỏ hơn."],1,"Thao tác bấm không đều gây sai số ngẫu nhiên, khắc phục bằng đo nhiều lần lấy trung bình."],
["Hiểu","Hiểu đơn vị dẫn xuất của hệ SI","Lực hấp dẫn giữa hai chất điểm: F = G·m₁·m₂/r². Phát biểu nào sau đây về đơn vị của hằng số G trong hệ SI là đúng?",["G có đơn vị cơ bản riêng của hệ SI, không liên quan đến đơn vị của F, m, r.", "Đơn vị của G chỉ phụ thuộc vào đơn vị của khối lượng m₁ và m₂.", "Đơn vị của G là đơn vị dẫn xuất, được suy ra từ công thức bằng cách biểu diễn G theo F, m₁, m₂ và r.", "Đơn vị của G không thể xác định từ công thức mà chỉ có được bằng thực nghiệm."],2,"G = F·r²/(m₁m₂) nên đơn vị của G suy ra từ đơn vị của F, r, m: N·m²/kg² = m³·kg⁻¹·s⁻². Đây là đơn vị dẫn xuất."],
["Hiểu","So sánh quãng đường đi được và độ dịch chuyển","Một con kiến bò dọc theo thước thẳng từ vạch 5 cm đến vạch 35 cm rồi quay lại vạch 20 cm. Nhận định nào sau đây về quãng đường đi được và độ dịch chuyển của kiến là đúng?",["Quãng đường đi được lớn hơn độ lớn độ dịch chuyển vì kiến đã đổi chiều chuyển động.", "Quãng đường đi được bằng độ lớn độ dịch chuyển vì kiến bò trên đường thẳng.", "Độ lớn độ dịch chuyển lớn hơn quãng đường đi được vì độ dịch chuyển có hướng.", "Độ dịch chuyển bằng tổng độ dài các đoạn kiến đã bò, không phụ thuộc vào vị trí đầu và cuối."],0,"s = 30 + 15 = 45 cm; d = 20 − 5 = 15 cm. Kiến đổi chiều nên s > |d|. Đi trên đường thẳng mà đổi chiều thì s vẫn lớn hơn |d|."],
["Hiểu","Tính và so sánh tốc độ trung bình (một thao tác tư duy)","Một xe chạy trên đường thẳng: nửa quãng đường đầu với tốc độ 30 km/h, nửa quãng đường sau với tốc độ 60 km/h. Nhận định nào sau đây về tốc độ trung bình của xe trên cả quãng đường là đúng?",["Bằng trung bình cộng của hai tốc độ vì hai nửa quãng đường bằng nhau.", "Nhỏ hơn trung bình cộng của hai tốc độ vì xe mất nhiều thời gian hơn ở nửa quãng đường đi chậm.", "Lớn hơn trung bình cộng của hai tốc độ vì xe đi nhanh ở nửa quãng đường sau.", "Bằng tốc độ lớn nhất vì tốc độ trung bình luôn được tính theo giai đoạn đi nhanh nhất."],1,"v = s/(s/60 + s/120) = 40 km/h < 45 km/h (trung bình cộng), vì xe mất nhiều thời gian hơn ở nửa quãng đường đi chậm."],
["Vận dụng","Xác định độ dịch chuyển tổng hợp, quãng đường","Một ô tô đi thẳng 6 km theo hướng Tây, rẽ trái đi 4 km theo hướng Nam, rồi rẽ sang hướng Đông đi 3 km và dừng. Phát biểu nào sau đây về quãng đường đi được và độ dịch chuyển của ô tô là đúng?",["Quãng đường đi được bằng độ lớn độ dịch chuyển vì ô tô không quay lại điểm xuất phát.", "Độ lớn độ dịch chuyển bằng tổng độ dài các đoạn đường đã đi vì ô tô luôn chuyển động theo hướng xác định.", "Độ lớn độ dịch chuyển lớn hơn quãng đường đi được vì ô tô đã đổi hướng nhiều lần.", "Quãng đường là tổng độ dài các đoạn đã đi; độ dịch chuyển là vectơ nối vị trí đầu với vị trí cuối, được tổng hợp theo hướng của các đoạn nên có độ lớn nhỏ hơn quãng đường."],3,"s = 6 + 4 + 3 = 13 km. Tây 6 − Đông 3 = 3 km về hướng Tây; Nam 4 km → d = √(3² + 4²) = 5 km < 13 km."],
["Vận dụng","Vận dụng công thức cộng vận tốc","Một ca nô chạy xuôi dòng từ A đến B hết 1,5 h và ngược dòng từ B về A hết 2 h. Biết AB = 30 km. Nhận định nào sau đây về vận tốc của ca nô so với bờ là đúng?",["Khi xuôi dòng, vận tốc của ca nô so với bờ bằng tổng; khi ngược dòng bằng hiệu của vận tốc ca nô so với nước và vận tốc dòng nước so với bờ, nên xuôi dòng mất ít thời gian hơn.", "Vận tốc của ca nô so với bờ luôn bằng vận tốc của ca nô so với nước nên thời gian xuôi dòng và ngược dòng như nhau.", "Khi xuôi dòng, vận tốc của ca nô so với bờ bằng hiệu hai vận tốc nên đi xuôi dòng mất nhiều thời gian hơn.", "Vận tốc của dòng nước so với bờ không ảnh hưởng đến thời gian đi vì quãng đường AB không đổi."],0,"v xuôi = 30/1,5 = 20 km/h; v ngược = 30/2 = 15 km/h. Xuôi dòng: v = v ca nô/nước + v nước/bờ; ngược dòng: v = hiệu của hai vận tốc đó. Suy ra v nước = (20 − 15)/2 = 2,5 km/h."],

return `<div class=pg>${ph(p,"Nhập số rồi bấm Kiểm tra (dấu phẩy hoặc dấu chấm đều được)")}<div class="cols${q[6]?" hasg":""}"><div><p class=qt>${q[2]}</p><div class=sar><input id=sain class="sa ${d?(r.ok?"ok":"no"):""}" inputmode=decimal autocomplete=off aria-label="Đáp án" value="${d?r.v:(ST.dr[p.i]||"")}" ${d?"disabled":""}><span>${q[4]}</span>${d?"":`<button class=btn id=chk>Kiểm tra</button>`}</div>${d?`<div class="fb ${r.ok?"":"no"}" id=fb><b>${r.ok?"✓ Chính xác!":"✗ Chưa đúng."} Đáp án: ${String(q[3]).replace(".",",")} ${q[4]}</b><p>${q[5]}</p><small>Yêu cầu cần đạt: ${q[1]}</small></div>`:""}</div>${q[6]?`<div class=side>${q[6]()}</div>`:""}</div></div>`}
if(p.k==="tl"){const q=TL[p.i],sh=ST.rv[p.i];
return `<div class=pg>${ph(p,q.lv)}<p class=qt><b>${q.h}</b> <span class=lv>${q.lv}</span></p>${q.ctx}${q.p.map((x,k)=>`<p class=sub>${x[0]}</p><textarea data-tl="${p.i}_${k}" aria-label="Bài làm ${k+1}" placeholder="Trình bày bài làm (tùy chọn)">${ST.tl[p.i+"_"+k]||""}</textarea>${sh?`<div class=tlx>${x[1]()}</div>`:""}`).join("")}<button class="btn ${sh?"sec":""}" data-rv=${p.i}>${sh?"Ẩn đáp án":"Xem đáp án"}</button></div>`}
const a=pages.filter(x=>x.k==="mc"&&status(x)==="ok").length*.25;
let b=0;TF.forEach((q,i)=>q.s.forEach((s,k)=>{if(ST.tf[i][k]!==undefined&&ST.tf[i][k]==s[2])b+=.25}));
const c=pages.filter(x=>x.k==="sa"&&status(x)==="ok").length*.25;
const un=pages.filter(x=>["mc","sa"].includes(x.k)&&!status(x)).length+TF.reduce((n,q,i)=>n+q.s.filter((s,k)=>ST.tf[i][k]===undefined).length,0);
const bad=pages.map((x,i)=>[x,i]).filter(([x])=>status(x)==="no");
return `<div class="pg cv"><h1>KẾT QUẢ PHẦN TRẮC NGHIỆM</h1><div class=sc><div>Tổng<b>${f(a+b+c)}/7,00</b></div><div>Phần I<b>${f(a)}/4,00</b></div><div>Phần II<b>${f(b)}/2,00</b></div><div>Phần III<b>${f(c)}/1,00</b></div></div>
<p>${un?`Còn <b>${un}</b> ý/câu chưa làm (mở ☰ Câu hỏi để quay lại). `:""}Phần tự luận (3,0 điểm): đối chiếu bài làm với đáp án ở từng ý.</p>
${bad.length?`<p>Các câu cần xem lại:</p><div class=rv>${bad.map(([x,i])=>`<button data-go=${i}>${PN[x.k]} · ${x.i+1}</button>`).join("")}</div>`:""}
<button class="btn big" id=rs>Làm lại từ đầu</button></div>`}

function draw(keep){const y=scrollY,p=pages[cur];
$("#app").innerHTML=pageHtml(p);
$("#tt").innerHTML=`Đề 1 ôn tập giữa HK I · Vật lí 10 <span>— ${label(p)}</span>`;
$("#bl").textContent=label(p);
$("#pg").style.width=(cur/(pages.length-1)*100)+"%";
$("#pv").disabled=cur===0;$("#nx").disabled=cur===pages.length-1;
$("#nx").textContent=cur===pages.length-2?"Kết quả ▶":"Sau ▶";
if(keep){scrollTo(0,y);const e=$("#fb");if(e)e.scrollIntoView({block:"nearest",behavior:"smooth"})}else scrollTo(0,0)}
function go(n){if(n<0||n>=pages.length)return;cur=n;$("#ov").classList.remove("on");draw()}
function pick(i,j){if(ST.mc[i]!==undefined)return;ST.mc[i]=j;draw(1)}
function chk(){const p=pages[cur];if(p.k!=="sa"||ST.sa[p.i])return;const e=$("#sain"),v=parseFloat(e.value.replace(",","."));
if(e.value.trim()===""||isNaN(v)){e.focus();return}
ST.sa[p.i]={v:e.value,ok:Math.abs(v-SA[p.i][3])<.005};draw(1)}
function panel(){let h=`<div style="display:flex;justify-content:space-between;align-items:center"><b>Danh sách câu hỏi</b><button class=ib id=cl>Đóng ✕</button></div>`;
[["mc","Phần I"],["tf","Phần II"],["sa","Phần III"],["tl","Tự luận"]].forEach(([k,n])=>{h+=`<h3>${n}</h3><div class=cells>`+pages.map((x,i)=>[x,i]).filter(([x])=>x.k===k).map(([x,i])=>`<button class="${status(x)} ${i===cur?"cur":""}" data-go=${i}>${x.i+1}</button>`).join("")+`</div>`});
h+=`<h3>Khác</h3><div class=cells><button data-go=0 style="width:auto;padding:0 14px">Mở đầu</button><button data-go=${pages.length-1} style="width:auto;padding:0 14px">Kết quả</button></div><p style="color:var(--mut);font-size:16px">Xanh: đúng · Đỏ: có ý sai · Viền nét đứt: làm dở / đã xem đáp án.</p>`;
$("#pn").innerHTML=h;$("#ov").classList.add("on")}

document.addEventListener("click",e=>{const t=e.target.closest("button,[data-go]");if(!t)return;
if(t.dataset.mc!==undefined)pick(pages[cur].i,+t.dataset.mc);
else if(t.dataset.tf){const[k,v]=t.dataset.tf.split(":"),A=ST.tf[pages[cur].i];if(A[k]===undefined){A[k]=+v;draw(1)}}
else if(t.dataset.rv!==undefined){ST.rv[t.dataset.rv]=!ST.rv[t.dataset.rv];draw(1)}
else if(t.dataset.go!==undefined)go(+t.dataset.go);
else if(t.id==="chk")chk();
else if(t.id==="pv")go(cur-1);else if(t.id==="nx")go(cur+1);
else if(t.id==="menu")panel();else if(t.id==="cl")$("#ov").classList.remove("on");
else if(t.id==="rs"){ST.mc=[];ST.tf=TF.map(()=>[]);ST.sa=[];ST.dr=[];ST.tl={};ST.rv={};go(0)}
else if(t.id==="th"){const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark";t.textContent=d?"🌙":"☀️"}});
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")$("#ov").classList.remove("on")});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="sain")ST.dr[pages[cur].i]=t.value;else if(t.dataset&&t.dataset.tl)ST.tl[t.dataset.tl]=t.value});
document.addEventListener("keydown",e=>{const t=e.target.tagName;
if(t==="INPUT"||t==="TEXTAREA"){if(e.key==="Enter"&&e.target.id==="sain")chk();return}
if(e.key==="Escape")$("#ov").classList.remove("on");
else if(e.key==="ArrowRight")go(cur+1);else if(e.key==="ArrowLeft")go(cur-1);
else{const p=pages[cur];if(p.k==="mc"){const j="abcd1234".indexOf(e.key.toLowerCase());if(j>-1)pick(p.i,j%4)}}});
draw();
</script>
</body>
</html>
