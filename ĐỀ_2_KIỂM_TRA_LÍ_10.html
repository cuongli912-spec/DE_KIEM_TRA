<style>

const NQ = Q.length, TOTAL_TIME = 600, L = "ABCD";
const POINT_PER_Q = 1, MAX_POINT = NQ * POINT_PER_Q;   // mỗi câu 1 điểm, tổng 8 điểm
const fmtPt = v => String(+(+v).toFixed(2)).replace(".", ",");

/* Đồ thị d - t: quãng 0–5 s */
const figSVG = () => {
  const P = [[0, 0], [3, 6], [5, 0]], TM = 5, DM = 6;
  const X = t => 45 + t * 220 / TM, Y = d => 136 - d * 112 / DM;
  const path = P.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
  let tk = "", gd = "";
  for (let t = 0; t <= TM; t++) tk += `<line x1="${X(t)}" y1="133" x2="${X(t)}" y2="139" stroke="var(--mu)"/><text x="${X(t)}" y="152" font-size="11" fill="var(--mu)" text-anchor="middle">${t}</text>`;
  for (let d = 0; d <= DM; d += 2) gd += `<line x1="45" y1="${Y(d)}" x2="265" y2="${Y(d)}" stroke="var(--bd)" stroke-dasharray="3,3"/><text x="38" y="${Y(d) + 4}" font-size="11" fill="var(--mu)" text-anchor="end">${d}</text>`;
  return `<svg viewBox="0 0 305 165" role="img" aria-label="Đồ thị độ dịch chuyển d theo thời gian t">
    ${gd}<line x1="35" y1="136" x2="290" y2="136" stroke="var(--mu)"/><line x1="45" y1="8" x2="45" y2="146" stroke="var(--mu)"/>
    <path d="${path}" fill="none" stroke="var(--pr)" stroke-width="2.6"/>${tk}
    <text x="52" y="14" font-size="11" font-weight="600" fill="var(--tx)">d (m)</text>
    <text x="288" y="130" font-size="11" font-weight="600" fill="var(--tx)" text-anchor="end">t (s)</text>
  </svg>`;
};

const sh = a => {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };

function getRecords() {
  try { const a = JSON.parse(lsGet(STORAGE_KEY) || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; }
}

/* Gói dữ liệu gửi Google Sheet: gửi đủ mọi trường, kèm tên trường tiếng Việt + tiếng Anh
   để Apps Script (Code.gs) dùng tên nào cũng đọc được. */
function buildPayload(rec) {
  return {
    ...rec,
    maDe: rec.examCode, hoTen: rec.name, ten: rec.name, lop: rec.className, lopHoc: rec.className,
    class: rec.className, soCauDung: rec.score, correct: rec.score, tongSoCau: rec.total, tongCau: rec.total,
    diemSo: rec.diem, diemToiDa: rec.diemToiDa,
    thoiGianBatDau: rec.startTimestamp, startTime: rec.startTimestamp,
    thoiGianNop: rec.timestamp, submitTime: rec.timestamp,
    thoiGianLamGiay: rec.durationSec, thoiGianLam: rec.durationText, duration: rec.durationSec,
    chiTiet: rec.detailSummary,
    lyDoNop: rec.reason, tuDongNop: rec.autoSubmit ? "Có" : "Không", soLanRoiTab: rec.leaves,
    token: WEBHOOK_TOKEN
  };
}

function saveRecord(rec) {
  const list = getRecords();
  list.unshift(rec);
  const saved = lsSet(STORAGE_KEY, JSON.stringify(list));
  updateHistCounter();
  const webhook = lsGet(WEBHOOK_KEY) || DEFAULT_WEBHOOK;
  if (webhook.startsWith("https://")) {
    try {
      fetch(webhook, { method: "POST", mode: "no-cors", keepalive: true, headers: { "Content-Type": "application/json" }, body: JSON.stringify(buildPayload(rec)) }).catch(() => {});
    } catch (e) {}
  }
  return saved;
}

function updateHistCounter() {
  const el = document.getElementById("cntHist");
  if (el) el.textContent = getRecords().length;
}

function csvCell(v) {
  let s = String(v == null ? "" : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;   // chống chèn công thức khi mở bằng Excel
  return '"' + s.replace(/"/g, '""') + '"';
}

function exportCSV() {
  const list = getRecords();
  if (!list.length) { alert("Chưa có dữ liệu học sinh nào được lưu!"); return; }
  const headers = ["STT", "Mã đề", "Thời gian bắt đầu", "Thời gian nộp", "Họ và tên", "Lớp", "Số câu đúng", "Tổng số câu", "Điểm (tối đa " + MAX_POINT + ")", "Thời gian làm (giây)", "Thời gian làm (mm:ss)", "Lý do nộp", "Số lần rời tab"];
  const rows = list.map((r, idx) => [
    idx + 1, csvCell(r.examCode), csvCell(r.startTimestamp || "—"), csvCell(r.timestamp), csvCell(r.name), csvCell(r.className),
    r.score, r.total, fmtPt(r.diem != null ? r.diem : r.score), r.durationSec || 0, mmss(r.durationSec || 0), csvCell(r.reason || "—"), r.leaves != null ? r.leaves : 0
  ]);
  const csvContent = "\uFEFF" + [headers.join(";"), ...rows.map(e => e.join(";"))].join("\r\n");
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `Ket_Qua_VL10_${EXAM_SLUG}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportSingleJSON(rec) {
  const { detailSummary, ...safeRec } = rec;   // không đưa chi tiết đúng/sai từng câu cho học sinh
  const blob = new Blob([JSON.stringify(safeRec, null, 2)], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeName = (rec.name || "HocSinh").replace(/[^a-zA-Z0-9_\u00C0-\u1EF9-]/g, "_");
  a.href = url;
  const safeClass = (rec.className || "10").replace(/[^a-zA-Z0-9_\u00C0-\u1EF9-]/g, "_");
  a.download = `KetQua_${EXAM_SLUG}_${safeName}_${safeClass}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const m = document.getElementById("m");
let S = { name: "", className: "", order: [], opts: [], pickedPos: [], cur: 0, dl: 0, tick: null, sq: true /* luôn đảo */, startTime: 0, running: false, leaves: 0, lastLeave: 0, busy: false, warn: false, subArmed: false };
const mmss = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

function beep() {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .08;
    o.start(); o.stop(c.currentTime + .25);
  } catch (e) {}
}

const acBar = document.getElementById("ac");
function setBanner(html) {
  if (html) { acBar.innerHTML = html; acBar.hidden = false; }
  else { acBar.innerHTML = ""; acBar.hidden = true; }
}

/* Gọi khi học sinh rời trang. Chỉ có tác dụng trong lúc đang làm bài. */
function onLeave(kind) {
  if (!ANTI_CHEAT.enabled || !S.running || S.busy) return;
  const now = Date.now();
  if (now - S.lastLeave < 1500) return;      // gộp các sự kiện đến cùng lúc (visibility + blur)
  S.lastLeave = now;
  S.leaves++;
  if (S.leaves > ANTI_CHEAT.maxLeaves) result(kind);
  else S.warn = true;                         // còn lượt cảnh báo: báo khi em quay lại
}
function showWarnIfAny() {
  if (!S.running || !S.warn) return;
  S.warn = false;
  const left = ANTI_CHEAT.maxLeaves - S.leaves + 1;
  setBanner(`⚠️ Em vừa rời khỏi trang làm bài (lần ${S.leaves}). Còn <b>${left}</b> lần cảnh báo – lần rời trang tiếp theo bài sẽ được <b>nộp tự động</b>!`);
}

function home() {
  clearInterval(S.tick);
  setBanner("");
  updateHistCounter();
  const savedWebhook = lsGet(WEBHOOK_KEY) || DEFAULT_WEBHOOK;
  m.innerHTML = `<div class="card">
    <h1>Kiểm tra 10 phút (${EXAM_CODE}) · Vật lí 10 · Giữa học kì I (Bài 1–7)</h1>
    <div class="mu">Trọng tâm: ${FOCUS}</div>
    <div class="info">
      <span>${NQ} câu trắc nghiệm A, B, C, D</span>
      <span>${GRAPH_TAG}</span>
      <span>Tổng thời gian chung: 10 phút</span>
      <span>Thang điểm: ${MAX_POINT} điểm (mỗi câu ${POINT_PER_Q} điểm)</span>
      <span>Mỗi bạn một thứ tự câu và đáp án riêng</span>
      <span>Đáp án công bố sau</span>
      <span>Tự động lưu kết quả</span>
      ${ANTI_CHEAT.enabled ? `<span style="background:var(--no);color:var(--not)">Rời tab = tự động nộp bài</span>` : ""}
    </div>
    <p style="margin:6px 0 10px;font-size:.88em">Bài kiểm tra gồm <b>${NQ} câu</b> với <b>đồng hồ chung 10 phút</b>. Học sinh có thể bấm chọn số thứ tự câu (1 → 8) để xem lại trước khi nộp bài.</p>
    ${ANTI_CHEAT.enabled ? `<div class="rule">🚫 <b>Quy định làm bài:</b> trong lúc làm bài, em <b>không được chuyển sang tab, cửa sổ hay ứng dụng khác</b> (kể cả thu nhỏ trình duyệt, mở thông báo, mở Zalo/Google…). ${ANTI_CHEAT.maxLeaves === 0 ? "Hệ thống sẽ <b>tự động nộp bài ngay lập tức</b> và ghi nhận lí do cho thầy." : `Em được cảnh báo ${ANTI_CHEAT.maxLeaves} lần, lần tiếp theo bài sẽ <b>tự động nộp</b>.`} Hãy tắt thông báo, đóng các tab khác và để chế độ không làm phiền trước khi bắt đầu.<br><label style="margin:8px 0 0"><input type="checkbox" id="agree" style="width:1.1em;height:1.1em;vertical-align:-.15em"> Em đã đọc và đồng ý với quy định trên</label></div>` : ""}
    ${/Zalo|FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\//i.test(navigator.userAgent) ? `<div class="rule">📱 Em đang mở bằng trình duyệt trong ứng dụng (Zalo/Messenger…). Nếu bài lỗi hoặc không bấm được, hãy chọn <b>⋯ → Mở bằng Safari</b> (hoặc Chrome) rồi làm lại.</div>` : ""}
    <div id="err" class="acnote" style="font-size:.9em"></div>
    <div class="form-grid">
      <label>Họ và tên học sinh (*)<br><input type="text" id="nm" placeholder="Ví dụ: Nguyễn Văn An" value="${esc(S.name)}" autocomplete="off"></label>
      <label>Lớp (*)<br><input type="text" id="cl" placeholder="Ví dụ: 10A1" value="${esc(S.className)}" autocomplete="off"></label>
    </div>
    <div class="row">
      <button class="btn" id="go">▶ Bắt đầu làm bài (10 phút)</button>
      <button class="btn sec" id="viewSaved">📊 Xem & Xuất bảng điểm (${getRecords().length})</button>
    </div>
    <details class="noprint">
      <summary>⚙️ Cài đặt nâng cao cho Giáo viên (Đồng bộ Google Sheets tự động)</summary>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
        <input type="url" id="whUrl" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(savedWebhook)}" style="flex:1">
        <button class="btn sec" id="saveWh">Lưu cấu hình</button>
      </div>
    </details>
  </div>`;

  document.getElementById("go").onclick = () => {
    const nm = document.getElementById("nm").value.trim();
    const cl = document.getElementById("cl").value.trim();
    const err = document.getElementById("err");
    if (!nm || !cl) {
      err.textContent = "⚠ Vui lòng nhập đầy đủ Họ tên và Lớp trước khi làm bài!";
      document.getElementById(nm ? "cl" : "nm").focus();
      return;
    }
    const ag = document.getElementById("agree");
    if (ANTI_CHEAT.enabled && ag && !ag.checked) {
      err.textContent = "⚠ Em hãy tick vào ô “Em đã đọc và đồng ý với quy định” để bắt đầu.";
      return;
    }
    S.name = nm; S.className = cl;
    start();
  };
  document.getElementById("viewSaved").onclick = showHistoryView;
  document.getElementById("saveWh").onclick = () => {
    const val = document.getElementById("whUrl").value.trim();
    const okSave = lsSet(WEBHOOK_KEY, val);
    alert(!okSave ? "Trình duyệt không cho lưu cấu hình." : val ? "Đã lưu đường dẫn Google Sheet Webhook!" : "Đã xóa đường dẫn Webhook.");
  };
}

function start() {
  const idx = [...Q.keys()];
  S.order = S.sq ? sh(idx) : idx;
  S.opts = Q.map(() => sh([0, 1, 2, 3]));
  S.pickedPos = Q.map(() => null);
  S.cur = 0;
  S.startTime = Date.now();
  S.running = true;
  S.leaves = 0; S.lastLeave = 0; S.warn = false; S.busy = false;
  setBanner("");
  S.dl = S.startTime + TOTAL_TIME * 1000;
  clearInterval(S.tick);
  S.tick = setInterval(tickFn, 250);
  renderQuestion();
}

function renderQuestion() {
  const k = S.order[S.cur], q = Q[k];
  const answeredCount = S.pickedPos.filter(x => x !== null).length;
  const navHtml = S.order.map((origIdx, i) => {
    const isDone = S.pickedPos[origIdx] !== null;
    const isCur = i === S.cur;
    return `<button class="qbtn ${isDone ? "done" : ""} ${isCur ? "cur" : ""}" data-idx="${i}" title="Câu ${i + 1}">${i + 1}</button>`;
  }).join("");

  m.innerHTML = `<div class="card">
    <div class="hd">
      <span>${EXAM_CODE} · Câu ${S.cur + 1}/${NQ} <span class="tag">${q.b} · ${q.lv}</span></span>
      <span class="tm" id="tm">--:--</span>
    </div>
    <div class="bar" id="bar"><i id="bi"></i></div>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:6px">
      <div class="mu">Học sinh: <b>${esc(S.name)}</b> (${esc(S.className)}) · Đã chọn: <b>${answeredCount}/${NQ}</b> câu${ANTI_CHEAT.enabled ? `<div class="acnote">🔒 Rời tab/cửa sổ làm bài sẽ ${ANTI_CHEAT.maxLeaves === 0 ? "bị tự động nộp bài" : "bị cảnh báo, quá " + ANTI_CHEAT.maxLeaves + " lần sẽ tự động nộp"}</div>` : ""}</div>
      <div class="qnav">${navHtml}</div>
    </div>
    <div class="q">${q.t}</div>${q.f ? `<div class="fig">${figSVG(q.f)}</div>` : ""}
    <div id="ops">${S.opts[k].map((oi, p) => `<button class="opt ${S.pickedPos[k] === p ? "sel" : ""}" data-p="${p}"><b>${L[p]}</b><span>${q.o[oi]}</span></button>`).join("")}</div>
    <div class="row">
      <div style="display:flex;gap:8px">
        <button class="btn sec" id="prevBtn" ${S.cur === 0 ? "disabled" : ""}>← Câu trước</button>
        <button class="btn sec" id="nextBtn" ${S.cur === NQ - 1 ? "disabled" : ""}>Câu tiếp →</button>
      </div>
      <button class="btn ok" id="subBtn">✓ Nộp bài (${answeredCount}/${NQ})</button>
    </div>
  </div>`;

  m.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.p));
  m.querySelectorAll(".qbtn").forEach(b => b.onclick = () => { S.cur = +b.dataset.idx; renderQuestion(); });
  document.getElementById("prevBtn").onclick = () => { if (S.cur > 0) { S.cur--; renderQuestion(); } };
  document.getElementById("nextBtn").onclick = () => { if (S.cur < NQ - 1) { S.cur++; renderQuestion(); } };
  document.getElementById("subBtn").onclick = () => {
    const left = NQ - S.pickedPos.filter(x => x !== null).length;
    const sb = document.getElementById("subBtn");
    if (left > 0 && !S.subArmed) {
      S.subArmed = true;
      sb.textContent = `⚠ Còn ${left} câu chưa chọn – bấm lần nữa để nộp`;
      setTimeout(() => { S.subArmed = false; const b = document.getElementById("subBtn"); if (b) b.textContent = `✓ Nộp bài (${NQ - left}/${NQ})`; }, 4000);
      return;
    }
    S.subArmed = false;
    result("self");
  };
  tickFn();
}

function pick(p) {
  const k = S.order[S.cur];
  S.pickedPos[k] = p;
  renderQuestion();
}

function tickFn() {
  const r = Math.max(0, Math.ceil((S.dl - Date.now()) / 1000)), tm = document.getElementById("tm");
  if (!tm) return;
  tm.textContent = "⏱ " + mmss(r);
  const low = r <= 60;
  tm.classList.toggle("low", low);
  document.getElementById("bar").classList.toggle("low", low);
  document.getElementById("bi").style.width = (Math.max(0, S.dl - Date.now()) / (TOTAL_TIME * 10)) + "%";
  if (r <= 0) {
    beep();
    result("time");
  }
}

function result(kind) {
  if (!S.running) return;
  S.running = false;
  clearInterval(S.tick);
  setBanner("");
  kind = kind || "self";
  const auto = kind === "tab" || kind === "blur";
  const durationSec = Math.min(TOTAL_TIME, Math.round((Date.now() - S.startTime) / 1000));
  const ans = Q.map((q, k) => S.pickedPos[k] == null ? null : S.opts[k][S.pickedPos[k]]);
  const ok = Q.map((q, k) => ans[k] === 0);
  const sc = ok.filter(Boolean).length;
  const diem = +(sc * POINT_PER_Q).toFixed(2);

  const by = {}, lv = {};
  Q.forEach((q, k) => {
    (by[q.b] = by[q.b] || { n: 0, c: 0 }).n++;
    if (ok[k]) by[q.b].c++;
    (lv[q.lv] = lv[q.lv] || { n: 0, c: 0 }).n++;
    if (ok[k]) lv[q.lv].c++;
  });

  const detailArr = Q.map((q, k) => `C${k + 1}[HS thấy câu ${S.order.indexOf(k) + 1}]:${ans[k] === 0 ? "Đ" : (ans[k] == null ? "Trống" : "S")}`);
  const endTs = Date.now();
  const record = {
    id: endTs, examCode: EXAM_CODE, examSlug: EXAM_SLUG,
    startTimestamp: new Date(S.startTime).toLocaleString("vi-VN"), startTs: S.startTime,
    timestamp: new Date(endTs).toLocaleString("vi-VN"), submitTs: endTs,
    name: S.name || "Khách", className: S.className || "—",
    score: sc, total: NQ, diem: diem, diemToiDa: MAX_POINT,
    durationSec: durationSec, durationText: mmss(durationSec),
    reason: REASON_TEXT[kind], autoSubmit: auto, leaves: S.leaves,
    detailSummary: detailArr.join(" | ")
  };
  const saved = saveRecord(record);

  m.innerHTML = `<div class="card">
    <div class="mu">${EXAM_CODE} · Học sinh: <b>${esc(record.name)}</b> · Lớp: <b>${esc(record.className)}</b> · Nộp lúc: ${record.timestamp}</div>
    <div class="score">${fmtPt(diem)}/${fmtPt(MAX_POINT)} điểm (${sc}/${NQ} câu đúng)</div>
    <div class="mu">Bắt đầu: ${record.startTimestamp} · Thời gian làm bài: ${mmss(durationSec)} / 10:00</div>
    ${auto ? `<div class="rule" style="margin-top:12px">⚠️ <b>Bài đã được nộp tự động</b> vì em rời khỏi trang làm bài. Điểm được tính theo các câu em đã chọn tại thời điểm đó và lí do đã được ghi nhận cho thầy.</div>` : ""}
    ${saved ? `<div class="badge-save">✓ Đã tự động lưu kết quả vào trình duyệt này!</div>` : `<div class="badge-save" style="background:var(--no);color:var(--not)">⚠ Không lưu được trên trình duyệt này – hãy bấm “Tải phiếu (.json)” để giữ kết quả.</div>`}
    <div class="ex" style="margin-top:12px">🔒 Bài làm của em đã được ghi nhận. Đáp án và lời giải sẽ do thầy công bố sau khi cả lớp hoàn thành. Các em không trao đổi đáp án với nhau nhé!</div>
    <div class="row noprint">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ok" id="dlCsv">📥 Xuất Excel (CSV)</button>
        <button class="btn sec" id="dlJson">📄 Tải phiếu (.json)</button>
        <button class="btn sec" id="pr">🖨️ In / Lưu PDF</button>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn sec" id="allHist">📊 Danh sách đã lưu</button>
        <button class="btn" id="again">🔄 Lượt làm mới</button>
      </div>
    </div>
  </div>`;

  document.getElementById("again").onclick = () => { S.name = ""; home(); };
  document.getElementById("pr").onclick = () => window.print();
  document.getElementById("dlCsv").onclick = exportCSV;
  document.getElementById("dlJson").onclick = () => exportSingleJSON(record);
  document.getElementById("allHist").onclick = showHistoryView;
  window.scrollTo(0, 0);
}

function showHistoryView() {
  clearInterval(S.tick);
  const list = getRecords();
  const rows = list.length
    ? list.map((r, i) => `<tr>
        <td>${i + 1}</td><td>${esc(r.examCode || EXAM_CODE)}</td><td>${esc(r.startTimestamp || "—")}</td><td>${esc(r.timestamp)}</td>
        <td><b>${esc(r.name)}</b></td><td>${esc(r.className)}</td>
        <td><b>${r.score}/${r.total}</b></td>
        <td><b style="color:var(--pr)">${fmtPt(r.diem != null ? r.diem : r.score)}/${fmtPt(r.diemToiDa != null ? r.diemToiDa : r.total)}</b></td>
        <td>${mmss(r.durationSec || 0)}</td>
        <td style="${r.autoSubmit ? "color:var(--not);font-weight:600" : ""}">${esc(r.reason || "—")}</td>
      </tr>`).join("")
    : `<tr><td colspan="10" style="text-align:center;padding:18px;color:var(--mu)">Chưa có lượt làm bài nào được lưu.</td></tr>`;

  m.innerHTML = `<div class="card">
    <div class="hd">
      <h1>📊 Bảng tổng hợp kết quả ${EXAM_CODE} (${list.length} lượt)</h1>
      <button class="btn sec" id="backHome">← Quay lại</button>
    </div>
    <div class="row noprint" style="margin-bottom:10px">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ok" id="expCsvBtn">📥 Xuất toàn bộ ra Excel (.CSV)</button>
        <button class="btn sec" id="printTbl">🖨️ In bảng điểm</button>
      </div>
      <button class="btn danger" id="clearBtn">🗑️ Xóa lịch sử</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>STT</th><th>Mã đề</th><th>Bắt đầu</th><th>Nộp lúc</th><th>Họ và tên</th><th>Lớp</th><th>Số câu đúng</th><th>Điểm</th><th>Thời gian làm</th><th>Lý do nộp</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;

  document.getElementById("backHome").onclick = home;
  document.getElementById("expCsvBtn").onclick = exportCSV;
  document.getElementById("printTbl").onclick = () => window.print();
  document.getElementById("clearBtn").onclick = () => {
    if (confirm(`Xóa toàn bộ lịch sử điểm của ${EXAM_CODE} trên máy này?`)) {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} updateHistCounter(); showHistoryView();
    }
  };
}

let fs = 20;
const setFs = v => { fs = Math.max(14, Math.min(44, v)); document.body.style.setProperty("--fs", fs + "px"); document.getElementById("fs").textContent = fs; };
document.getElementById("am").onclick = () => setFs(fs - 2);
document.getElementById("ap").onclick = () => setFs(fs + 2);
document.getElementById("fs").onclick = () => setFs(20);
document.getElementById("btnHist").onclick = () => {
  if (S.running) { alert("Đang trong giờ làm bài – hãy nộp bài trước khi xem bảng điểm."); return; }
  showHistoryView();
};
document.getElementById("dk").onclick = () => {
  const r = document.documentElement;
  const d = r.dataset.theme == "dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme:dark)").matches);
  r.dataset.theme = d ? "light" : "dark";
};
document.addEventListener("keydown", e => {
  if (!document.getElementById("ops") || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[a-dA-D]$/.test(e.key)) pick("ABCD".indexOf(e.key.toUpperCase()));
  else if (/^[1-4]$/.test(e.key)) pick(+e.key - 1);
  else if (e.key == "ArrowRight" && S.cur < NQ - 1) { S.cur++; renderQuestion(); }
  else if (e.key == "ArrowLeft" && S.cur > 0) { S.cur--; renderQuestion(); }
});

/* ===== Phát hiện rời tab / cửa sổ ===== */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) onLeave("tab");
  else showWarnIfAny();
});
window.addEventListener("pagehide", () => onLeave("tab"));   // tải lại / đóng trang cũng bị tính
window.addEventListener("blur", () => {
  if (!ANTI_CHEAT.enabled || !ANTI_CHEAT.detectBlur) return;
  setTimeout(() => { if (S.running && !S.busy && !document.hasFocus()) onLeave("blur"); }, 700);
});
window.addEventListener("focus", showWarnIfAny);

home();
</script>
</body>
</html>
