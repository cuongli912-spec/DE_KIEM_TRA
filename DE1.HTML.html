<style>
:root{--bg:#e8ecf1;--pp:#fff;--ink:#17202b;--mut:#5a6677;--acc:#1d4e89;--ok:#17703f;--no:#b3261e;--ln:#d3dae3;--tn:#f1f5fa;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--pp:#181e26;--ink:#e5e9ef;--mut:#9aa6b6;--acc:#86b4ea;--ok:#5fd093;--no:#ff8f86;--ln:#2c3541;--tn:#1e2631;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1318;--pp:#181e26;--ink:#e5e9ef;--mut:#9aa6b6;--acc:#86b4ea;--ok:#5fd093;--no:#ff8f86;--ln:#2c3541;--tn:#1e2631;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Source Serif 4","Times New Roman",serif}
.pp{max-width:780px;margin:16px auto;background:var(--pp);border:1px solid var(--ln);padding:28px 34px}
.hd{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:center;border-bottom:2px solid var(--ink);padding-bottom:14px;font-size:.9rem}
.hd b{display:block}.hd small{display:block;color:var(--mut);font-size:.85rem}
h1{font-size:1.25rem;text-align:center;margin:18px 0 2px}
h2{font-size:1.1rem;margin:26px 0 4px;color:var(--acc)}
h3{font-size:1rem;margin:18px 0 2px}
.note{margin:0 0 6px;color:var(--mut);font-size:.9rem}
.grp{margin:16px 0 0;font-weight:600;color:var(--acc);border-bottom:1px solid var(--ln)}
.q{margin:14px 0;padding-bottom:10px;border-bottom:1px dashed var(--ln)}
.q p{margin:2px 0}
.tg{font-size:.95rem}
.lv{font-size:.74rem;padding:1px 8px;border:1px solid var(--acc);border-radius:99px;color:var(--acc);font-family:system-ui,sans-serif}
.yc{font-size:.82rem;color:var(--mut);font-style:italic}
.o{display:flex;gap:8px;align-items:flex-start;padding:3px 6px;border-radius:6px;cursor:pointer}
.o:hover{background:var(--tn)}
.o input{margin-top:7px}
.o.ok span{text-decoration:underline;text-underline-offset:4px;color:var(--ok);font-weight:600}
.o.no span{color:var(--no);text-decoration:line-through}
.st{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px;padding:6px 8px;margin:4px 0;border-left:3px solid transparent;background:var(--tn)}
.st>span:first-child{flex:1 1 360px}
.st.ok{border-left-color:var(--ok)}.st.no{border-left-color:var(--no)}
.tf{display:flex;gap:12px;white-space:nowrap}
.tf label{cursor:pointer}
.st .ex{flex-basis:100%}
.sa,textarea{font:inherit;color:inherit;background:var(--pp);border:1px solid var(--ln);border-radius:6px;padding:6px 10px}
.sa{width:150px}textarea{width:100%;min-height:64px;margin:4px 0}
.sa.ok{border-color:var(--ok)}.sa.no{border-color:var(--no)}
.ex{display:none;margin:6px 0 0;padding:8px 12px;background:var(--tn);border-left:3px solid var(--acc);font-size:.92rem}
.done .ex{display:block}
.tb{border-collapse:collapse;margin:8px 0}.tb th,.tb td{border:1px solid var(--ln);padding:3px 12px;text-align:center}
.g{display:block;width:100%;max-width:360px;margin:8px 0}
.g line{stroke-width:1}.gl{stroke:var(--ln)}.ga{stroke:var(--mut)}
.gp{fill:none;stroke:var(--acc);stroke-width:2.2}.gd{fill:var(--acc)}
.gt{fill:var(--mut);font:10px system-ui,sans-serif}
.bar{display:flex;gap:10px;margin:22px 0 8px;flex-wrap:wrap}
button{font:inherit;padding:9px 18px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--pp);cursor:pointer}
button.sec{background:transparent;color:var(--acc)}
.res{display:none;padding:12px 16px;border:2px solid var(--acc);border-radius:8px}
.done .res{display:block}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(max-width:560px){.pp{padding:18px 16px;margin:0}.hd{grid-template-columns:1fr}}
</style>
</head>

const $=s=>document.querySelector(s),f=n=>n.toFixed(2).replace(".",",");
function G(p,xm,ym,yn,xs,ys){const w=320,h=200,L=36,T=10,B=26,R=12,W=w-L-R,H=h-T-B,X=t=>L+t/xm*W,Y=d=>T+(ym-d)/(ym-yn)*H;
let s=`<svg class=g viewBox="0 0 ${w} ${h}" role=img aria-label="Đồ thị độ dịch chuyển – thời gian">`;
for(let t=0;t<=xm;t+=xs)s+=`<line class=${t?"gl":"ga"} x1=${X(t)} y1=${T} x2=${X(t)} y2=${T+H}></line><text class=gt x=${X(t)} y=${h-10} text-anchor=middle>${t}</text>`;
for(let d=yn;d<=ym;d+=ys)s+=`<line class=${d?"gl":"ga"} x1=${L} y1=${Y(d)} x2=${L+W} y2=${Y(d)}></line><text class=gt x=${L-5} y=${Y(d)+4} text-anchor=end>${d}</text>`;
return s+`<polyline class=gp points="${p.map(q=>X(q[0])+","+Y(q[1])).join(" ")}"></polyline>`+p.map(q=>`<circle class=gd cx=${X(q[0])} cy=${Y(q[1])} r=3></circle>`).join("")+`<text class=gt x=${w-4} y=${Y(0)-5} text-anchor=end>t (s)</text><text class=gt x=${L+6} y=${T+10}>d (m)</text></svg>`}
const g1=()=>G([[0,0],[4,8],[6,8],[10,-4]],10,8,-4,2,4),g2=()=>G([[0,0],[4,6],[6,6],[8,2]],8,6,0,2,2),g3=()=>G([[1,3],[5,15]],6,18,0,1,3),g4=()=>G([[0,0],[4,8],[6,8],[10,0]],10,8,0,2,2);

const MC=[
["Biết","Nêu được đối tượng nghiên cứu của Vật lí học","Đối tượng nghiên cứu của Vật lí học là các dạng vận động của",["sinh vật và môi trường sống.","chất, trường và năng lượng.","chỉ các chất ở thể rắn.","các hiện tượng xã hội."],1],
["Biết","Nhận biết các bước tìm hiểu thế giới tự nhiên dưới góc độ vật lí","Trong tiến trình tìm hiểu thế giới tự nhiên dưới góc độ vật lí, sau bước “Đưa ra dự đoán” là bước",["Kết luận.","Quan sát, thu thập thông tin.","Thí nghiệm kiểm tra dự đoán.","Xác định vấn đề cần nghiên cứu."],2],
["Biết","Nhận biết quy tắc an toàn trong học tập môn Vật lí","Trước khi cắm hoặc tháo một thiết bị điện khỏi ổ cắm, việc cần làm đúng là",["tắt công tắc nguồn của thiết bị.","giữ tay ướt để bám chắc phích cắm.","kéo mạnh dây điện để rút cho nhanh.","bật công tắc ở mức lớn nhất."],0],
["Biết","Chỉ ra đơn vị cơ bản và đơn vị dẫn xuất của hệ SI","Đơn vị nào sau đây KHÔNG phải là đơn vị cơ bản của hệ SI?",["kilôgam (kg).","mét (m).","giây (s).","niutơn (N)."],3],
["Biết","Định nghĩa được độ dịch chuyển","Đại lượng vừa cho biết độ dài, vừa cho biết hướng của sự thay đổi vị trí của vật gọi là",["quãng đường đi được.","tốc độ trung bình.","độ dịch chuyển.","thời gian chuyển động."],2],
["Biết","Nhận biết dụng cụ đo tốc độ trong phòng thí nghiệm","Để đo tốc độ tức thời của viên bi lăn trên máng nghiêng tại một vị trí xác định, bộ dụng cụ phù hợp là",["lực kế và thước dây.","cổng quang điện và đồng hồ đo thời gian hiện số.","nhiệt kế và đồng hồ treo tường.","vôn kế và ampe kế."],1],
["Hiểu","Phân biệt các loại mô hình trong nghiên cứu vật lí","Khi nghiên cứu chuyển động của ô tô trên quãng đường dài hàng trăm km, người ta coi ô tô là một chất điểm. Chất điểm thuộc loại mô hình nào?",["Mô hình lí thuyết.","Mô hình vật chất (vật thu nhỏ hoặc phóng to).","Mô hình toán học.","Không phải là mô hình."],0,"Chất điểm là khái niệm được trừu tượng hóa nên là mô hình lí thuyết."],
["Hiểu","Lập luận về quy tắc an toàn, nguy cơ cháy nổ","Vì sao không được dùng nước để dập đám cháy xảy ra ở thiết bị điện đang có điện?",["Vì nước bay hơi quá nhanh nên không dập được lửa.","Vì nước làm đám cháy lan rộng hơn.","Vì nước làm thiết bị nguội quá nhanh.","Vì nước dẫn điện, người dập lửa có nguy cơ bị điện giật."],3,"Nước dẫn điện nên có nguy cơ điện giật; phải ngắt nguồn điện trước."],
["Hiểu","Lập luận nêu loại sai số và cách khắc phục","Một học sinh dùng đồng hồ bấm giây đo thời gian rơi của vật, các lần bấm lệch nhau do phản xạ của tay. Đây là loại sai số nào và cách hạn chế hiệu quả nhất là gì?",["Sai số hệ thống; hiệu chỉnh lại điểm 0 của đồng hồ.","Sai số ngẫu nhiên; đo nhiều lần rồi lấy giá trị trung bình.","Sai số hệ thống; đo nhiều lần rồi lấy giá trị trung bình.","Sai số ngẫu nhiên; chỉ đo một lần bằng đồng hồ có độ chia nhỏ hơn."],1,"Thao tác bấm không đều gây sai số ngẫu nhiên, khắc phục bằng đo nhiều lần lấy trung bình."],
["Hiểu","Rút ra đơn vị của hằng số từ công thức vật lí","Lực hấp dẫn giữa hai chất điểm: F = G·m₁·m₂/r². Đơn vị của hằng số G theo các đơn vị cơ bản của hệ SI là",["kg·m³·s⁻².","m³·kg·s⁻².","m³·kg⁻¹·s⁻².","m²·kg⁻¹·s⁻²."],2,"G = F·r²/(m₁m₂) → N·m²/kg² = kg·m·s⁻²·m²/kg² = m³·kg⁻¹·s⁻²."],
["Hiểu","So sánh quãng đường đi được và độ dịch chuyển","Một con kiến bò dọc theo thước thẳng từ vạch 5 cm đến vạch 35 cm rồi quay lại vạch 20 cm. Quãng đường đi được và độ lớn độ dịch chuyển của kiến lần lượt là",["45 cm và 15 cm.","15 cm và 45 cm.","30 cm và 15 cm.","45 cm và 45 cm."],0,"s = 30 + 15 = 45 cm; d = 20 − 5 = 15 cm."],
["Hiểu","Tính tốc độ trung bình (một thao tác tư duy)","Một xe chạy trên đường thẳng: nửa quãng đường đầu với tốc độ 30 km/h, nửa quãng đường sau với tốc độ 60 km/h. Tốc độ trung bình của xe trên cả quãng đường là",["45 km/h.","40 km/h.","50 km/h.","36 km/h."],1,"v = s/(s/60 + s/120) = 40 km/h (không phải trung bình cộng 45 km/h)."],
["Vận dụng","Xác định độ dịch chuyển tổng hợp, quãng đường","Một ô tô đi thẳng 6 km theo hướng Tây, rẽ trái đi 4 km theo hướng Nam, rồi rẽ sang hướng Đông đi 3 km và dừng. Quãng đường đi được và độ lớn độ dịch chuyển của ô tô lần lượt là",["13 km và 7 km.","13 km và 13 km.","5 km và 13 km.","13 km và 5 km."],3,"Tây 6 − Đông 3 = 3 km về hướng Tây; Nam 4 km → d = √(3² + 4²) = 5 km; s = 6 + 4 + 3 = 13 km."],
["Vận dụng","Vận dụng công thức cộng vận tốc","Một ca nô chạy xuôi dòng từ A đến B hết 1,5 h và ngược dòng từ B về A hết 2 h. Biết AB = 30 km. Vận tốc của dòng nước so với bờ là",["2,5 km/h.","5 km/h.","17,5 km/h.","35 km/h."],0,"v xuôi = 30/1,5 = 20 km/h; v ngược = 30/2 = 15 km/h; v nước = (20 − 15)/2 = 2,5 km/h."],
["Vận dụng","Tính vận tốc từ độ dốc của đồ thị d – t","Dùng đồ thị d – t của một vật chuyển động thẳng như hình để trả lời câu 15 và câu 16. Vận tốc của vật trong giai đoạn từ 6 s đến 10 s là",["3 m/s.","−1,2 m/s.","−3 m/s.","1,2 m/s."],2,"Độ dốc = (−4 − 8)/(10 − 6) = −3 m/s (vật chuyển động ngược chiều dương).",g1],
["Vận dụng","Vận dụng công thức tính tốc độ từ đồ thị d – t","Dựa vào đồ thị ở câu 15, tốc độ trung bình của vật trong 10 s đầu là",["0,4 m/s.","2 m/s.","−0,4 m/s.","1,2 m/s."],1,"s = 8 + 0 + 12 = 20 m → 20/10 = 2 m/s. (−0,4 m/s là vận tốc trung bình.)"]
];

s:[["Biết","Các lần đo không trùng nhau dù cùng điều kiện là biểu hiện của sai số ngẫu nhiên.",1,""],
["Biết","Sai số hệ thống là sai lệch không có quy luật, lúc lệch phía này lúc lệch phía kia giữa các lần đo.",0,"Sai số hệ thống có quy luật, làm kết quả luôn lệch về một phía."],
["Hiểu","Tăng số lần đo rồi lấy giá trị trung bình giúp giảm ảnh hưởng của sai số ngẫu nhiên.",1,""],
["Hiểu","Nếu đồng hồ luôn chỉ lệch +0,05 s khi chưa bấm, chỉ cần tăng số lần đo thật nhiều thì giá trị trung bình sẽ về đúng giá trị thực.",0,"Lấy trung bình không loại được sai số hệ thống; phải hiệu chỉnh lại điểm 0 của đồng hồ."]]},
{t:"Nhóm học sinh khảo sát xe lăn trên đường ray thẳng, chọn gốc tọa độ tại cảm biến, chiều dương là chiều xe rời xa cảm biến. Dự đoán: ở giai đoạn đầu xe chuyển động thẳng đều. Kiểm tra: từ số liệu cảm biến, nhóm vẽ đồ thị độ dịch chuyển – thời gian như hình rồi đọc từng giai đoạn.",g:g2,
s:[["Hiểu","Trong 4 s đầu, đồ thị là đoạn thẳng dốc lên nên xe chuyển động thẳng đều với vận tốc 1,5 m/s theo chiều dương.",1,""],

function render(){
let h=`<div class=pp><div class=hd><div><b>SỞ GIÁO DỤC VÀ ĐÀO TẠO ĐỒNG THÁP</b><b>TRƯỜNG THPT PHẠM THÀNH TRUNG</b><small>ĐỀ ÔN TẬP</small></div><div><b>ĐỀ KIỂM TRA GIỮA HỌC KỲ I</b><b>NĂM HỌC: 2026 – 2027</b><b>MÔN: VẬT LÝ 10</b><small>Thời gian làm bài: 45 phút</small></div></div>
<h1>ĐỀ ÔN TẬP GIỮA HỌC KỲ I – VẬT LÝ 10</h1><p class=note style="text-align:center">Nội dung: Bài 1 đến Bài 7 (đến đồ thị độ dịch chuyển – thời gian)</p>
<h2>A. PHẦN TRẮC NGHIỆM (7 điểm)</h2><h3>PHẦN I. Câu trắc nghiệm nhiều phương án lựa chọn.</h3><p class=note>Thí sinh trả lời từ câu 1 đến câu 16, mỗi câu chỉ chọn 1 phương án (0,25 điểm/câu). Sau khi nộp bài, đáp án đúng được gạch chân.</p>`;
MC.forEach((q,i)=>{if(!i||q[0]!=MC[i-1][0])h+=`<div class=grp>${q[0]}</div>`;
h+=`<div class=q id=m${i}><p class=tg><b>Câu ${i+1}.</b> <span class=lv>${q[0]}</span> <span class=yc>${q[1]}</span></p><p>${q[2]}</p>${q[6]?q[6]():""}${q[3].map((o,j)=>`<label class=o><input type=radio name=m${i} value=${j}><span>${"ABCD"[j]}. ${o}</span></label>`).join("")}${q[5]?`<div class=ex>${q[5]}</div>`:""}</div>`});
h+=`<h3>PHẦN II. Câu trắc nghiệm đúng – sai.</h3><p class=note>Thí sinh trả lời từ câu 1 đến câu 2. Trong mỗi ý a), b), c), d) ở mỗi câu, thí sinh chỉ chọn đúng hoặc sai (0,25 điểm/ý).</p>`;
TF.forEach((q,i)=>{h+=`<div class=q><p><b>Câu ${i+1}.</b> ${q.t}</p>${q.g?q.g():""}`+q.s.map((s,k)=>`<div class=st id=t${i}_${k}><span>${"abcd"[k]}) <span class=lv>${s[0]}</span> ${s[1]}</span><span class=tf><label><input type=radio name=t${i}_${k} value=1> Đúng</label><label><input type=radio name=t${i}_${k} value=0> Sai</label></span><div class=ex>Đáp án: <b>${s[2]?"Đúng":"Sai"}</b>${s[3]?". "+s[3]:""}</div></div>`).join("")+`</div>`});
h+=`<h3>PHẦN III. Câu trắc nghiệm trả lời ngắn.</h3><p class=note>Thí sinh trả lời từ câu 1 đến câu 4 (0,25 điểm/câu). Dùng dấu phẩy hoặc dấu chấm cho số thập phân.</p>`;
SA.forEach((q,i)=>{h+=`<div class=q><p class=tg><b>Câu ${i+1}.</b> <span class=lv>${q[0]}</span> <span class=yc>${q[1]}</span></p><p>${q[2]}</p>${q[6]?q[6]():""}<input class=sa id=s${i} inputmode=decimal autocomplete=off aria-label="Đáp án câu ${i+1}"> ${q[4]}<div class=ex>ĐA: <b>${String(q[3]).replace(".",",")}</b>. ${q[5]}</div></div>`});
const ta=(n)=>`<textarea aria-label="Bài làm ${n}" placeholder="Trình bày bài làm"></textarea>`;
h+=`<h2>B. PHẦN TỰ LUẬN (3 điểm)</h2>
<div class=q><p><b>Bài 1. (1,5 điểm)</b> <span class=lv>Biết</span> <span class=yc>Vẽ đồ thị d – t từ số liệu; tính vận tốc, tốc độ trung bình, vận tốc trung bình</span></p>
<p>Một xe ô tô đồ chơi chạy trên đường thẳng, chọn chiều dương là chiều chuyển động ban đầu. Bảng số liệu độ dịch chuyển d theo thời gian t:</p>
<table class=tb><tr><th>t (s)</th><td>0</td><td>2</td><td>4</td><td>6</td><td>8</td><td>10</td></tr><tr><th>d (m)</th><td>0</td><td>4</td><td>8</td><td>8</td><td>4</td><td>0</td></tr></table>
<p>a) (0,5 đ) Vẽ đồ thị độ dịch chuyển – thời gian của xe.</p>${ta("1a")}<div class=ex>Nối các điểm (0; 0), (2; 4), (4; 8), (6; 8), (8; 4), (10; 0): đoạn đầu dốc lên, đoạn từ 4 s đến 6 s nằm ngang, đoạn cuối dốc xuống.${g4()}</div>
<p>b) (0,5 đ) Tính vận tốc của xe trong từng giai đoạn chuyển động.</p>${ta("1b")}<div class=ex>0–4 s: v = (8 − 0)/4 = 2 m/s (theo chiều dương). 4–6 s: v = 0 (đứng yên). 6–10 s: v = (0 − 8)/4 = −2 m/s (ngược chiều dương).</div>
<p>c) (0,5 đ) Tính tốc độ trung bình và vận tốc trung bình của xe trong 10 s.</p>${ta("1c")}<div class=ex>s = 8 + 8 = 16 m → tốc độ trung bình = 16/10 = 1,6 m/s. d = 0 − 0 = 0 → vận tốc trung bình = 0.</div></div>
<div class=q><p><b>Bài 2. (1,5 điểm)</b> <span class=lv>Vận dụng</span> <span class=yc>Xác định độ dịch chuyển tổng hợp, vận tốc tổng hợp</span></p>
<p>Một ca nô qua con sông rộng 120 m, mũi ca nô luôn hướng vuông góc với bờ. Vận tốc của ca nô so với nước là 4 m/s, nước chảy so với bờ với vận tốc 3 m/s.</p>
<p>a) (0,5 đ) Tính thời gian ca nô sang tới bờ bên kia.</p>${ta("2a")}<div class=ex>t = 120/4 = 30 s.</div>
<p>b) (0,5 đ) Tính quãng đường ca nô bị nước trôi dọc theo bờ.</p>${ta("2b")}<div class=ex>Quãng trôi = 3 × 30 = 90 m.</div>
<p>c) (0,5 đ) Tính độ lớn vận tốc của ca nô so với bờ và độ lớn độ dịch chuyển của ca nô so với điểm xuất phát.</p>${ta("2c")}<div class=ex>v₁₃ = √(4² + 3²) = 5 m/s (0,25 đ). d = √(120² + 90²) = 150 m, hoặc 5 × 30 = 150 m (0,25 đ).</div></div>
<div class=bar><button id=sub>Nộp bài và xem đáp án</button><button id=rs class=sec>Làm lại</button></div><div class=res id=res></div></div>`;
$("#app").innerHTML=h;document.body.classList.remove("done");$("#sub").onclick=chk;$("#rs").onclick=()=>{render();scrollTo(0,0)}}

function chk(){let a=0,b=0,c=0;
MC.forEach((q,i)=>{const k=document.querySelector(`input[name=m${i}]:checked`),L=document.querySelectorAll(`#m${i} .o`);L[q[4]].classList.add("ok");if(k){if(+k.value==q[4])a++;else L[+k.value].classList.add("no")}});
TF.forEach((q,i)=>q.s.forEach((s,k)=>{const r=document.querySelector(`input[name=t${i}_${k}]:checked`),e=$(`#t${i}_${k}`);if(r&&+r.value==s[2]){b++;e.classList.add("ok")}else e.classList.add("no")}));
SA.forEach((q,i)=>{const e=$("#s"+i),v=parseFloat(e.value.replace(",","."));if(Math.abs(v-q[3])<.005){c++;e.classList.add("ok")}else e.classList.add("no")});
a*=.25;b*=.25;c*=.25;
document.body.classList.add("done");document.querySelectorAll("input,textarea").forEach(e=>e.disabled=true);
$("#res").innerHTML=`<b>Kết quả phần trắc nghiệm: ${f(a+b+c)}/7,00 điểm</b><br>Phần I: ${f(a)}/4,00. Phần II: ${f(b)}/2,00. Phần III: ${f(c)}/1,00.<br>Phần tự luận (3,0 điểm): đối chiếu bài làm với đáp án và biểu điểm ở từng ý phía trên.`;
$("#res").scrollIntoView({behavior:"smooth",block:"center"})}
render();
</script>
</body>
</html>
