parts:[
{k:'1a',sub:'a) (0,5 điểm) Vẽ đồ thị độ dịch chuyển – thời gian (d – t) của xe đạp:',f:[
 {id:'tl1a_1',lb:'Từ t = 0 s đến t = 6 s, đồ thị là đoạn thẳng:',t:'s',a:'up',o:[['up','Đi lên từ (0; 0) đến (6; 12)'],['flat','Nằm ngang tại d = 12 m'],['down','Đi xuống từ (6; 12) về (0; 0)']]},
 {id:'tl1a_2',lb:'Từ t = 6 s đến 9 s và từ 9 s đến 15 s:',t:'s',a:'correct',o:[['correct','Nằm ngang (6 s–9 s) tại d = 12 m, rồi đi xuống về (15; 0)'],['wrong1','Đi lên tiếp đến d = 24 m rồi nằm ngang'],['wrong2','Đi xuống về (9; 0) rồi nằm ngang đến 15 s']]}],
 exp:`<b>Đáp án 1a:</b> đồ thị gồm 3 đoạn thẳng: đi lên từ (0;0) đến (6;12); nằm ngang từ (6;12) đến (9;12); đi xuống từ (9;12) về (15;0).${svgExp1}`},
{k:'1b',sub:'b) (0,5 điểm) Tính vận tốc của xe đạp trong từng giai đoạn chuyển động:',f:[
 {id:'tl1b_1',lb:'Vận tốc giai đoạn 1 (0 s đến 6 s) v₁ (m/s):',t:'n',a:2},

 exp:`<b>Đáp án 1b:</b> v₁ = (12 − 0)/6 = <b>2 m/s</b>; v₂ = 0; v₃ = (0 − 12)/(15 − 9) = <b>−2 m/s</b>.`},
{k:'1c',sub:'c) (0,5 điểm) Tính tốc độ trung bình và vận tốc trung bình của xe đạp trong 15 s:',f:[

 {id:'tl1c_2',lb:'Vận tốc trung bình v trong 15 s (m/s):',t:'n',a:0}],
 exp:`<b>Đáp án 1c:</b> quãng đường s = 12 + 0 + 12 = 24 m ⇒ v_tb = 24/15 = <b>1,6 m/s</b>; độ dịch chuyển d = 0 ⇒ vận tốc trung bình = <b>0 m/s</b>.`}]},
{title:'Bài 2 (1,5 điểm) – Đoàn tàu vượt qua xe đạp',
stem:`Trên hai làn đường thẳng song song, một đoàn tàu hỏa gồm <b>8 toa</b>, mỗi toa dài <b>15 m</b> (bỏ qua khoảng nối giữa các toa và chiều dài đầu tàu, xem kích thước xe đạp không đáng kể) chuyển động thẳng đều với tốc độ <b>14 m/s</b> so với mặt đất để vượt qua một người đi xe đạp. Người này chuyển động thẳng đều <b>cùng chiều</b> với đoàn tàu với tốc độ <b>4 m/s</b> so với mặt đất.<br><b>Quy ước:</b> (1) là đoàn tàu, (2) là người đi xe đạp, (3) là mặt đất; chiều dương là chiều chuyển động của đoàn tàu.`,
parts:[
{k:'2a',sub:'a) (0,5 điểm) Tính tổng chiều dài L của đoàn tàu và xác định v₁₃, v₂₃ theo chiều dương:',f:[
 {id:'tl2a_1',lb:'Tổng chiều dài L của 8 toa tàu (m):',t:'n',a:120},
 {id:'tl2a_2',lb:'Giá trị v₁₃ và v₂₃ theo chiều dương:',t:'s',a:'correct',o:[['correct','v₁₃ = +14 m/s; v₂₃ = +4 m/s'],['w1','v₁₃ = +14 m/s; v₂₃ = −4 m/s'],['w2','v₁₃ = −14 m/s; v₂₃ = +4 m/s']]}],
 exp:`<b>Đáp án 2a:</b> L = 8 · 15 = <b>120 m</b>; v₁₃ = <b>+14 m/s</b>, v₂₃ = <b>+4 m/s</b>.`},
{k:'2b',sub:'b) (0,5 điểm) Viết công thức cộng vận tốc và tính độ lớn vận tốc v₁₂ của tàu so với người đi xe đạp:',f:[
 {id:'tl2b_1',lb:'Công thức cộng vận tốc đúng:',t:'s',a:'correct',o:[['correct','v⃗₁₃ = v⃗₁₂ + v⃗₂₃ (suy ra v₁₂ = v₁₃ − v₂₃)'],['w1','v⃗₁₃ = v⃗₁₂ − v⃗₂₃ (suy ra v₁₂ = v₁₃ + v₂₃)'],['w2','v₁₂ = v₁₃ . v₂₃']]},
 {id:'tl2b_2',lb:'Độ lớn vận tốc v₁₂ của tàu so với xe đạp (m/s):',t:'n',a:10}],
 exp:`<b>Đáp án 2b:</b> v⃗₁₃ = v⃗₁₂ + v⃗₂₃; chiếu lên chiều dương: v₁₂ = v₁₃ − v₂₃ = 14 − 4 = <b>10 m/s</b>.`},
{k:'2c',sub:'c) (0,5 điểm) Tính thời gian cả đoàn tàu vượt qua hoàn toàn người đi xe đạp và quãng đường xe đạp đi được trên mặt đất trong thời gian đó:',f:[
 {id:'tl2c_1',lb:'Thời gian tàu vượt qua xe đạp t (s):',t:'n',a:12},
 {id:'tl2c_2',lb:'Quãng đường xe đạp đi được trên mặt đất s₂ (m):',t:'n',a:48}],
 exp:`<b>Đáp án 2c:</b> t = L/v₁₂ = 120/10 = <b>12 s</b>; s₂ = v₂₃ · t = 4 · 12 = <b>48 m</b>.`}]}

const pages=[{t:'info',lb:'ⓘ'}];
mcqData.forEach((_,i)=>pages.push({t:'m',i,lb:i+1}));
tfData.forEach((d,i)=>d.items.forEach((_,j)=>pages.push({t:'f',i,j,lb:'Đ'+(i+1)+'abcd'[j]})));
saData.forEach((_,i)=>pages.push({t:'s',i,lb:'T'+(i+1)}));
esData.forEach((b,bi)=>b.parts.forEach((p,pi)=>pages.push({t:'e',bi,pi,lb:'TL'+p.k})));
const QN=pages.length-1;

const fok=f=>{const v=A['e_'+f.id];return f.t==='s'?v===f.a:Math.abs(parseNum(v)-f.a)<0.05};
const locked=p=>S.done||(p.t==='m'?A['m'+p.i]!==undefined:p.t==='f'?A['f'+p.i+'_'+p.j]!==undefined:p.t==='s'?!!A['sk'+p.i]:p.t==='e'?!!A['ek'+esData[p.bi].parts[p.pi].k]:false);
function good(p){
 if(p.t==='m')return A['m'+p.i]===mcqData[p.i].ans;
 if(p.t==='f')return A['f'+p.i+'_'+p.j]===String(tfData[p.i].items[p.j].ans);
 if(p.t==='s')return Math.abs(parseNum(A['s'+p.i])-saData[p.i].ans)<0.05;
 if(p.t==='e')return esData[p.bi].parts[p.pi].f.every(fok);
}
const st=p=>(p.t==='info'||p.t==='res')?'':locked(p)?(good(p)?'ok':'no'):'';
function score(){let a=0,b=0,c=0,d=0;
 mcqData.forEach((x,i)=>{if(A['m'+i]===x.ans)a+=.25});
 tfData.forEach((x,i)=>x.items.forEach((y,j)=>{if(A['f'+i+'_'+j]===String(y.ans))b+=.25}));
 saData.forEach((x,i)=>{if(Math.abs(parseNum(A['s'+i])-x.ans)<0.05)c+=.25});
 esData.forEach(x=>x.parts.forEach(p=>p.f.forEach(f=>{if(fok(f))d+=.25})));
 return[a,b,c,d]}

const hd=(a,b)=>`<div class="hd"><b>${a}</b><span>${b}</span></div>`;
const ex=h=>`<div class="exp">${h}</div>`;
function info(){return `<div class="q" style="text-align:center"><b style="color:var(--p)">ĐỀ ÔN TẬP KIỂM TRA GIỮA HỌC KỲ I – ĐỀ 02</b><br>Vật Lí 10 (GDPT 2018) · 45 phút</div>
<div class="q">Mỗi trang một câu. Chọn xong: <b style="color:var(--ok)">đúng → màu xanh</b>, <b style="color:var(--no)">sai → màu đỏ</b> (không đổi lại được).</div>
<div class="q">Họ và tên (*)<br><input class="inp w" data-a="info" data-f="name" value="${esc(S.name)}" placeholder="Nhập đầy đủ họ và tên..."></div>
<div class="q">Lớp (*) <input class="inp" data-a="info" data-f="cls" value="${esc(S.cls)}" placeholder="10A1"> &nbsp; SBD <input class="inp" data-a="info" data-f="id" value="${esc(S.id)}" placeholder="tùy chọn"></div>
<button class="btn" data-a="go">${S.on?'Tiếp tục ▶':'▶ Bắt đầu làm bài'}</button>`}
function resP(){const[a,b,c,d]=score(),f=n=>n.toFixed(2).replace('.',',');
 return `<div class="q" style="text-align:center"><b>KẾT QUẢ BÀI LÀM</b><br>${esc(S.name)} · Lớp ${esc(S.cls)}<div class="big">${f(a+b+c+d)} / 10,0 điểm</div></div>
<div class="q">Phần I: ${f(a)} / 4,0<br>Phần II: ${f(b)} / 2,0<br>Phần III: ${f(c)} / 1,0<br>Tự luận: ${f(d)} / 3,0</div>
${S.sync?`<div class="sy ${S.sync.c}">${S.sync.m}</div>`:''}<br><button class="btn" data-a="rv">↺ Xem lại bài (đáp án đã hiện)</button>`}

function pg(p){
 if(p.t==='info')return info();
 if(p.t==='res')return resP();
 const L=locked(p);
 if(p.t==='m'){const d=mcqData[p.i],k=A['m'+p.i];
  return hd('Câu '+(p.i+1),'Phần I · 0,25 điểm')+`<div class="q">${d.q}</div>${d.svg||''}`+d.opts.map((o,x)=>`<button class="opt ${L?(x===d.ans?'ok':x===k?'no':''):''}" data-a="m" data-i="${p.i}" data-x="${x}" ${L?'disabled':''}>${o}</button>`).join('')+(L?ex(`<b>Đáp án đúng:</b> ${d.opts[d.ans]}<br>${d.exp}`):'')}
 if(p.t==='f'){const d=tfData[p.i],it=d.items[p.j],k=A['f'+p.i+'_'+p.j],an=String(it.ans);
  const e=d.exp.replace('Giải thích: ','').split(/; (?=[a-d]\) )/)[p.j];
  const b=(v,l)=>`<button class="opt ${L?(v===an?'ok':v===k?'no':''):''}" data-a="f" data-i="${p.i}" data-j="${p.j}" data-x="${v}" ${L?'disabled':''}>${l}</button>`;
  return hd(d.title.replace(/ \(.*\)/,'')+' · ý '+it.label,'Phần II · 0,25 điểm')+`<details ${p.j?'':'open'}><summary>📄 Dữ kiện &amp; hình vẽ của câu (bấm để xem/ẩn)</summary><div class="q">${d.stem}</div>${d.svg}</details><div class="q"><b>${it.label}</b> ${it.text}</div><div class="tfb">${b('true','Đúng')}${b('false','Sai')}</div>`+(L?ex('<b>Giải thích:</b> '+e):'')}
 if(p.t==='s'){const d=saData[p.i],v=A['s'+p.i]||'',c=L?(good(p)?'ok':'no'):'';
  return hd(d.num.replace(/ \(.*\)/,''),'Phần III · 0,25 điểm')+`<div class="q">${d.q}</div>${d.svg}<div class="q"><b>Đáp số:</b> <input class="inp ${c}" data-a="sv" data-i="${p.i}" value="${esc(v)}" placeholder="Nhập số" ${L?'disabled':''}> ${d.unit} ${L?'':`<button class="btn" data-a="sk" data-i="${p.i}">Kiểm tra</button>`}</div>`+(L?ex(`<b>Đáp số đúng: ${String(d.ans).replace('.',',')} ${d.unit}</b><br>${d.exp}`):'')}
 const b=esData[p.bi],q=b.parts[p.pi];
 return hd(b.title.split(' – ')[0].replace(/ \(.*\)/,'')+' · ý '+q.k.slice(1),'Phần B · 0,25 điểm/ô')+`<details ${p.pi?'':'open'}><summary>📄 Đề bài &amp; số liệu (bấm để xem/ẩn)</summary><div class="q">${b.stem}</div></details><div class="q"><b>${q.sub}</b></div>`+q.f.map(f=>{const v=A['e_'+f.id]||'',c=L?(fok(f)?'ok':'no'):'';
  return `<div class="q">${f.lb}<br>`+(f.t==='s'?`<select class="inp ${c}" data-a="ev" data-id="${f.id}" ${L?'disabled':''}><option value="">-- Chọn --</option>${f.o.map(o=>`<option value="${o[0]}" ${v===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`:`<input class="inp ${c}" data-a="ev" data-id="${f.id}" value="${esc(v)}" placeholder="Nhập số" ${L?'disabled':''}>`)+`</div>`}).join('')+(L?ex(q.exp):`<button class="btn" data-a="ek" data-k="${q.k}">Kiểm tra</button>`)}

function fit(){const s=$('#stage'),k=Math.min(1,Math.max(.6,innerWidth/900)),z=F==='auto'?[40,38,36,34,32,30,28]:[F];
 for(const x of z){E=x;document.documentElement.style.setProperty('--fs',x*k+'px');if(s.scrollHeight<=s.clientHeight+1)break}
 $('#fsl').textContent=(F==='auto'?'Tự động · ':'')+E+'px'}

 cur=Math.max(0,Math.min(pages.length-1,n));const p=pages[cur];$('#page').innerHTML=pg(p);$('#stage').scrollTop=0;fit();
 $('#lb').textContent=p.t==='info'?'Thông tin':p.t==='res'?'Kết quả':`Trang ${cur}/${QN}`;$('#bar').style.width=Math.min(cur,QN)/QN*100+'%'}
function openMap(){const w=$('#mapw');if(w.classList.toggle('on'))$('#map').innerHTML=pages.slice(1).map((p,k)=>`<button class="mp ${st(p)} ${k+1===cur?'cu':''}" data-a="gt" data-i="${k+1}">${p.lb}</button>`).join('')}
const tick=()=>{const m=Math.floor(S.t/60),s=S.t%60;$('#tm').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s};
function setSync(o){S.sync=o;if(pages[cur].t==='res')redraw()}

function submit(auto){
 if(S.done)return;if(!S.on){alert('Bạn chưa bắt đầu làm bài.');return}
 if(!auto){const n=pages.filter(p=>p.t!=='info'&&p.t!=='res'&&!locked(p)).length;
  if(!confirm((n?`Còn ${n} trang chưa trả lời/kiểm tra. `:'')+'Bạn chắc chắn muốn nộp bài và xem kết quả?'))return}
 S.done=true;clearInterval(tm);$('#sub').disabled=true;$('#sub').textContent='ĐÃ NỘP';
 pages.push({t:'res',lb:'🏁'});show(pages.length-1);
 const[a,b,c,d]=score(),tot=(a+b+c+d).toFixed(2),used=2700-S.t;
 setSync({c:'wt',m:'⏳ Đang lưu điểm vào hệ thống Google Drive của Thầy Cường...'});
 fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({
  hoTen:S.name||'Không tên',lop:S.cls||'Không rõ',sbd:S.id,maDe:'Vật Lí 10 - Giữa HK1 - Đề 02',

  thoiGianLamBai:`${Math.floor(used/60)}p ${used%60}s`,ngayNop:new Date().toLocaleString('vi-VN')})})
 .then(()=>setSync({c:'ok',m:'✅ Đã lưu điểm thành công vào Google Drive!'}))
 .catch(()=>setSync({c:'no',m:'⚠️ Không thể kết nối mạng để lưu tự động. Em hãy chụp màn hình kết quả này gửi qua Zalo cho Thầy nhé!'}))}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t||t.tagName==='INPUT'||t.tagName==='SELECT')return;
 const a=t.dataset.a,i=+t.dataset.i,x=t.dataset.x;
 if(a==='fs'){const c=F==='auto'?E:F;F=x==='a'?'auto':x==='+'?Math.min(40,c+2):Math.max(28,c-2);fit();return}
 if(a==='mp'){openMap();return}
 if(a==='gt'){$('#mapw').classList.remove('on');show(i);return}
 if(a==='pv'){show(cur-1);return}if(a==='nx'){show(cur+1);return}
 if(a==='sub'){submit();return}if(a==='rv'){show(1);return}
 if(a==='go'){if(!S.name.trim()||!S.cls.trim()){alert('Vui lòng nhập đầy đủ Họ và tên, Lớp!');return}
  if(!S.on){S.on=true;tm=setInterval(()=>{S.t--;if(S.t<=0){S.t=0;tick();submit(true);return}tick()},1000)}show(1);return}
 if(a==='m')A['m'+i]=+x;
 else if(a==='f')A['f'+i+'_'+t.dataset.j]=x;
 else if(a==='sk')A['sk'+i]=1;
 else if(a==='ek')A['ek'+t.dataset.k]=1;
 redraw()});
document.addEventListener('input',e=>{const t=e.target,a=t.dataset.a;
 if(a==='info')S[t.dataset.f]=t.value;else if(a==='sv')A['s'+t.dataset.i]=t.value;else if(a==='ev')A['e_'+t.dataset.id]=t.value});
document.addEventListener('keydown',e=>{const t=e.target,a=t.dataset&&t.dataset.a;
 if(e.key==='Enter'&&a==='sv'){A['sk'+t.dataset.i]=1;redraw();return}
 if(/INPUT|SELECT/.test(t.tagName))return;
 if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1)});
addEventListener('resize',fit);
window.onload=()=>show(0);
